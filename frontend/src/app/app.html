<main style="padding: 20px;">
  <h1>Cardápio Digital</h1>

  @if (produtos.length === 0) {
    <p>Nenhum produto encontrado ou carregando...</p>
  } @else {
    <ul>
      @for (produto of produtos; track produto.id) {
        <li>
          <strong>{{ produto.nome }}</strong> - R$ {{ produto.preco }}
        </li>
      }
    </ul>
  }

  <router-outlet />
</main>
