<app-navbar></app-navbar>

<main class="container">
  <app-categorias-tabs (onFiltroChange)="onFiltroChange($event)"></app-categorias-tabs>

  <!-- CARDÁPIO / LISTA DE PRODUTOS -->
  <section class="cardapio">
    @if (carregandoLista) {
      <p>Carregando produtos...</p>
    } @else if (produtosFiltrados().length === 0) {
      <p>Nenhum produto encontrado.</p>
    } @else {
      <div class="grid">
        @for (produto of produtosFiltrados(); track produto.id) {
          <app-produto-card [produto]="produto"></app-produto-card>
        }
      </div>
    }
  </section>

  <!-- FORMULÁRIO DE CADASTRO -->
  <section style="background: #f4f4f4; padding: 15px; border-radius: 8px; margin: 20px 0;">
    <h2>Cadastrar Novo Produto</h2>

    <form (ngSubmit)="cadastrarProduto()">
      <div style="margin-bottom: 10px;">
        <label for="nome" style="display: block; margin-bottom: 4px;">Nome do Produto:</label>
        <input
          type="text"
          id="nome"
          name="nome"
          [(ngModel)]="novoProduto.nome"
          placeholder="Ex: X-Salada"
          style="width: 100%; padding: 8px; box-sizing: border-box;"
          required
        />
      </div>

      <div style="margin-bottom: 10px;">
        <label for="categoria" style="display: block; margin-bottom: 4px;">Categoria:</label>
        <select
          id="categoria"
          name="categoria"
          [(ngModel)]="novoProduto.categoriaId"
          style="width: 100%; padding: 8px; box-sizing: border-box;"
          required
        >
          <option value="" disabled>Selecione uma categoria</option>
          @for (cat of categorias(); track cat.id) {
            <option [value]="cat.id">{{ cat.nome }}</option>
          }
        </select>
      </div>

      <!-- CAMPO DE DESCRIÇÃO -->
      <div style="margin-bottom: 10px;">
        <label for="descricao" style="display: block; margin-bottom: 4px;">Descrição:</label>
        <textarea
          id="descricao"
          name="descricao"
          [(ngModel)]="novoProduto.descricao"
          placeholder="Ex: Pão, hambúrguer 180g, queijo, alface e tomate"
          style="width: 100%; padding: 8px; box-sizing: border-box; height: 70px;"
        ></textarea>
      </div>

      <div style="margin-bottom: 10px;">
        <label for="preco" style="display: block; margin-bottom: 4px;">Preço (R$):</label>
        <input
          type="number"
          id="preco"
          name="preco"
          step="0.01"
          [(ngModel)]="novoProduto.preco"
          style="width: 100%; padding: 8px; box-sizing: border-box;"
          required
        />
      </div>

      <button type="submit" style="padding: 10px 15px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">
        Cadastrar Produto
      </button>
    </form>
  </section>
</main>

<app-carrinho-drawer></app-carrinho-drawer>
