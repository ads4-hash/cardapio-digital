name: CI

on:
  push:
    branches: [main]
  pull_request:

# O repositório é um workspace npm único (raiz -> package-lock.json): os jobs
# instalam a partir da raiz e executam os scripts no workspace correspondente.
jobs:
  backend:
    name: Backend (lint + test + e2e + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configura Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Instala dependências (workspace raiz)
        run: npm ci
      - name: Gera o Prisma Client
        run: npx prisma generate --schema backend/prisma/schema.prisma
      - name: Lint
        run: npm run lint --workspace backend
      - name: Testes
        run: npm test --workspace backend
      - name: Testes e2e
        run: npm run test:e2e --workspace backend
      - name: Build
        run: npm run build --workspace backend

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configura Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Instala dependências (workspace raiz)
        run: npm ci
      - name: Lint
        run: npm run lint --workspace frontend
      - name: Testes
        run: npm test --workspace frontend
      - name: Build
        run: npm run build --workspace frontend
