name: CI

on:
  push:
    branches: [main]
  pull_request:

# O repositório é um workspace npm único (raiz -> package-lock.json): os jobs
# instalam a partir da raiz e executam os scripts no workspace correspondente.
jobs:
  backend:
    name: Backend (lint + test + e2e + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configura Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Instala dependências (workspace raiz)
        run: npm ci
      - name: Gera o Prisma Client
        run: npx prisma generate --schema backend/prisma/schema.prisma
      - name: Lint
        run: npm run lint --workspace backend
      - name: Testes
        run: npm test --workspace backend
      - name: Testes e2e
        run: npm run test:e2e --workspace backend
      - name: Build
        run: npm run build --workspace backend

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configura Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Instala dependências (workspace raiz)
        run: npm ci
      - name: Lint
        run: npm run lint --workspace frontend
      - name: Testes
        run: npm test --workspace frontend
      - name: Build
        run: npm run build --workspace frontend

  # Constrói as imagens Docker sem publicá-las: é a única forma de garantir que
  # os Dockerfiles (etapas de build, COPY e o `prisma generate` no runtime) não
  # quebrem — os jobs acima só exercitam o código, não o empacotamento.
  docker:
    name: Docker (build das imagens)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configura o Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build da imagem do backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build da imagem do frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
