services:
  backend:
    build: ./backend
    container_name: projetinho-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      CONFIAR_PROXY: "false"
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads       # imagens enviadas pelo admin
      - banco:/app/prisma          # banco SQLite (arquivo dev.db)
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/produtos').then((r) => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: projetinho-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4000:4000"

volumes:
  uploads:
  banco: